# XcodeGen spec — run `xcodegen generate` to (re)create Flow.xcodeproj.
name: Flow
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    tvOS: "17.0"
  groupSortPosition: top

configFiles:
  Debug: Config/Flow.xcconfig
  Release: Config/Flow.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: $(FLOW_BUNDLE_ID)
    PRODUCT_NAME: Flow
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO

packages:
  FlowKit:
    path: Packages/FlowKit
  FlowDecoders:
    path: Packages/FlowDecoders

targetTemplates:
  FlowApp:
    type: application
    sources:
      - path: Flow
        excludes:
          - "Resources/Info-*.plist"
          - "Resources/*.entitlements"
      - path: Shared
    dependencies:
      - package: FlowKit
      - package: FlowDecoders
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Flow

targets:
  Flow-iOS:
    templates: [FlowApp]
    platform: iOS
    dependencies:
      - target: FlowWidgets
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Flow/Resources/Flow-iOS.entitlements
        SUPPORTS_MACCATALYST: NO
    info:
      path: Flow/Resources/Info-iOS.plist
      properties: &commonInfo
        CFBundleDisplayName: Flow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FlowTMDBAPIKey: $(FLOW_TMDB_API_KEY)
        FlowTraktClientID: $(FLOW_TRAKT_CLIENT_ID)
        FlowTraktClientSecret: $(FLOW_TRAKT_CLIENT_SECRET)
        FlowSimklClientID: $(FLOW_SIMKL_CLIENT_ID)
        FlowTVDBAPIKey: $(FLOW_TVDB_API_KEY)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsForMedia: true
        NSLocalNetworkUsageDescription: Flow connects to media servers, WebDAV shares and IPTV providers on your local network.
        CFBundleURLTypes:
          - CFBundleURLName: flow
            CFBundleURLSchemes: [flow]
        NSUserActivityTypes: [app.flow.title]
        FlowAppGroup: group.$(FLOW_BUNDLE_ID)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        LSSupportsOpeningDocumentsInPlace: false
        UIFileSharingEnabled: true
        LSApplicationQueriesSchemes: [infuse, vlc-x-callback, outplayer, SenPlayer, youtube]
    entitlements:
      path: Flow/Resources/Flow-iOS.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(FLOW_BUNDLE_ID)
        com.apple.security.application-groups: [group.$(FLOW_BUNDLE_ID)]

  Flow-macOS:
    templates: [FlowApp]
    platform: macOS
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Flow/Resources/Flow-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Flow/Resources/Info-macOS.plist
      properties:
        CFBundleDisplayName: Flow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FlowTMDBAPIKey: $(FLOW_TMDB_API_KEY)
        FlowTraktClientID: $(FLOW_TRAKT_CLIENT_ID)
        FlowTraktClientSecret: $(FLOW_TRAKT_CLIENT_SECRET)
        FlowSimklClientID: $(FLOW_SIMKL_CLIENT_ID)
        FlowTVDBAPIKey: $(FLOW_TVDB_API_KEY)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsForMedia: true
        NSLocalNetworkUsageDescription: Flow connects to media servers, WebDAV shares and IPTV providers on your local network.
        CFBundleURLTypes:
          - CFBundleURLName: flow
            CFBundleURLSchemes: [flow]
        NSUserActivityTypes: [app.flow.title]
        LSApplicationCategoryType: public.app-category.entertainment
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
    entitlements:
      path: Flow/Resources/Flow-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.downloads.read-write: true
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(FLOW_BUNDLE_ID)

  Flow-tvOS:
    templates: [FlowApp]
    platform: tvOS
    dependencies:
      - target: FlowTopShelf
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        CODE_SIGN_ENTITLEMENTS: Flow/Resources/Flow-tvOS.entitlements
    info:
      path: Flow/Resources/Info-tvOS.plist
      properties:
        CFBundleDisplayName: Flow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FlowTMDBAPIKey: $(FLOW_TMDB_API_KEY)
        FlowTraktClientID: $(FLOW_TRAKT_CLIENT_ID)
        FlowTraktClientSecret: $(FLOW_TRAKT_CLIENT_SECRET)
        FlowSimklClientID: $(FLOW_SIMKL_CLIENT_ID)
        FlowTVDBAPIKey: $(FLOW_TVDB_API_KEY)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsForMedia: true
        NSLocalNetworkUsageDescription: Flow connects to media servers, WebDAV shares and IPTV providers on your local network.
        CFBundleURLTypes:
          - CFBundleURLName: flow
            CFBundleURLSchemes: [flow]
        NSUserActivityTypes: [app.flow.title]
        FlowAppGroup: group.$(FLOW_BUNDLE_ID)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities: [arm64]
    entitlements:
      path: Flow/Resources/Flow-tvOS.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(FLOW_BUNDLE_ID)
        com.apple.security.application-groups: [group.$(FLOW_BUNDLE_ID)]

  FlowWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: ["*.plist", "*.entitlements"]
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: FlowWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(FLOW_BUNDLE_ID).widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Widgets/FlowWidgets.entitlements
        SKIP_INSTALL: YES
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Flow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FlowAppGroup: group.$(FLOW_BUNDLE_ID)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/FlowWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.$(FLOW_BUNDLE_ID)]

  FlowTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: TopShelf
        excludes: ["*.plist", "*.entitlements"]
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: FlowTopShelf
        PRODUCT_BUNDLE_IDENTIFIER: $(FLOW_BUNDLE_ID).topshelf
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_ENTITLEMENTS: TopShelf/FlowTopShelf.entitlements
        SKIP_INSTALL: YES
    info:
      path: TopShelf/Info.plist
      properties:
        CFBundleDisplayName: Flow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FlowAppGroup: group.$(FLOW_BUNDLE_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    entitlements:
      path: TopShelf/FlowTopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.$(FLOW_BUNDLE_ID)]

schemes:
  Flow-iOS:
    build:
      targets:
        Flow-iOS: all
    run:
      config: Debug
    test:
      config: Debug
  Flow-macOS:
    build:
      targets:
        Flow-macOS: all
  Flow-tvOS:
    build:
      targets:
        Flow-tvOS: all
