name: Stress tmp
on:
  push:
    branches: ["claude/ipad-watchlist-press"]
jobs:
  stress:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      FLOW_SIM_OS: "26"
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - run: brew install xcodegen && xcodegen generate
      - run: scripts/ui-test.sh ipad -only-testing:FlowUITests/TitleAndPlayerUITests/testAMoviePageShowsItsListActionsAndTheyToggle -test-iterations 15 -retry-tests-on-failure NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-log
          path: build/ui-tests-ipad.log
