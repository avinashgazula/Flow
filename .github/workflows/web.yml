name: Web

# Builds and checks Flow for the web, and publishes it to GitHub Pages from main and claude/ branches.
on:
  push:
    branches: [main, "claude/**"]
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc
      - name: Unit tests
        run: npm test
      - name: Rust tests
        if: hashFiles('web/crates/*/Cargo.toml') != ''
        run: for crate in crates/*/; do (cd "$crate" && cargo test --release); done
      - name: Build
        # Served from https://<owner>.github.io/<repo>/ on Pages.
        run: npx vite build
        env:
          FLOW_BASE: /${{ github.event.repository.name }}/
      - name: Bundle budget
        run: npm run budget
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  publish:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: web-pages
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - name: Push to the gh-pages branch
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deep links (a title page, a search) load the app, which routes them itself.
          cp index.html 404.html
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Flow for the web at ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published. Pages serves it at https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/ once Pages is set to deploy from the gh-pages branch." >> "$GITHUB_STEP_SUMMARY"
