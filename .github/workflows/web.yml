name: Web

# Builds and checks Flow for the web, and publishes it to GitHub Pages from main and claude/ branches.
on:
  push:
    branches: [main, "claude/**"]
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # The custom domain Pages serves the site on. Leave empty to serve from <owner>.github.io/<repo>/.
  PAGES_DOMAIN: media.gazula.dev

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc
      - name: Unit tests
        run: npm test
      - name: Rust tests
        if: hashFiles('web/crates/*/Cargo.toml') != ''
        run: for crate in crates/*/; do (cd "$crate" && cargo test --release); done
      - name: Build
        # At the domain's root on a custom domain, otherwise under /<repo>/ on github.io.
        run: FLOW_BASE="${PAGES_DOMAIN:+/}" FLOW_BASE="${FLOW_BASE:-/${{ github.event.repository.name }}/}" npx vite build
      - name: Bundle budget
        run: npm run budget
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  # The site in a real browser: the production build with sample data, every page, the main flows, settings, keyboard,
  # accessibility and offline, each browser in its own job. Nothing here touches the network (web/e2e/fixtures.ts).
  browser-tests:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build
        run: npm run build
      - name: Type-check the tests
        run: npm run e2e:types
      - name: Run the browser tests
        env:
          E2E_BROWSERS: ${{ matrix.browser }}
        run: npm run e2e
      - name: Summarise
        if: always()
        run: node e2e/summary.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

  publish:
    name: Publish to GitHub Pages
    needs: [build, browser-tests]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: web-pages
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - name: Push to the gh-pages branch
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deep links (a title page, a search) load the app, which routes them itself.
          cp index.html 404.html
          touch .nojekyll
          # Pages takes its custom domain from this file in the published branch.
          if [ -n "$PAGES_DOMAIN" ]; then echo "$PAGES_DOMAIN" > CNAME; fi
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Flow for the web at ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          site="${PAGES_DOMAIN:-${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}}"
          echo "Published. Pages serves it at https://${site}/ once Pages is set to deploy from the gh-pages branch." >> "$GITHUB_STEP_SUMMARY"
