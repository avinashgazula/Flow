name: Release

# Builds Flow for iPhone and iPad, Apple TV and the Mac, and attaches the apps to a GitHub release.
# Runs when a version tag (v1.2.0, v1.2.0-beta.1) is pushed, or by hand: for an existing tag, or for a
# new one at the commit given, which the release then creates. Sessions that can't push tags can
# instead write the new tag into .github/release-tag on main or a claude/ branch.
#
# The apps are unsigned: there's no Apple Developer account in CI. Install the IPAs with a
# sideloading tool that signs them with your own Apple ID (AltStore, SideStore, Sideloadly), or
# sign them yourself. Built without Config/Secrets.xcconfig, so no API keys are inside: enter your
# TMDB key at first launch.
on:
  push:
    tags: ["v*"]
    branches: [main, "claude/**"]
    paths: [.github/release-tag]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release (e.g. v1.0.0-beta.1)
        required: true
      ref:
        description: Commit or branch to build when the tag doesn't exist yet
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: iOS, scheme: Flow-iOS, destination: "generic/platform=iOS", products: Release-iphoneos, asset: Flow-iOS.ipa }
          - { name: tvOS, scheme: Flow-tvOS, destination: "generic/platform=tvOS", products: Release-appletvos, asset: Flow-tvOS.ipa }
          - { name: macOS, scheme: Flow-macOS, destination: "generic/platform=macOS", products: Release, asset: Flow-macOS.zip }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.inputs.tag || github.sha }}
      - name: Tag
        id: tag
        run: |
          tag="${{ github.event.inputs.tag }}"
          [ -z "$tag" ] && [ "${{ github.ref_type }}" = tag ] && tag="${{ github.ref_name }}"
          [ -z "$tag" ] && tag=$(tr -d '[:space:]' < .github/release-tag)
          case "$tag" in v*) ;; *) echo "Not a version tag: '$tag'" >&2; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build
        run: |
          version="${{ steps.tag.outputs.tag }}"
          version="${version#v}"
          xcodebuild build \
            -project Flow.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Release \
            -derivedDataPath build/release \
            MARKETING_VERSION="${version%%-*}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -80; exit 1; }
      - name: Package
        run: |
          app="build/release/Build/Products/${{ matrix.products }}/Flow.app"
          test -d "$app"
          mkdir -p dist
          if [ "${{ matrix.name }}" = macOS ]; then
            # Ad-hoc signed so it runs on Apple silicon; still unnotarised, so open it with right-click → Open.
            codesign --force --deep --sign - "$app"
            ditto -c -k --keepParent "$app" "dist/${{ matrix.asset }}"
          else
            mkdir -p Payload
            cp -R "$app" Payload/
            zip -qry "dist/${{ matrix.asset }}" Payload
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
      # What the AltStore source needs from the built app. AltStore refuses an IPA whose version and
      # build differ from the source's, so they're read from the app's Info.plist rather than the tag.
      - name: Read the app's details for the AltStore source
        if: matrix.name == 'iOS'
        continue-on-error: true
        run: |
          app="build/release/Build/Products/${{ matrix.products }}/Flow.app"
          # Unsigned builds carry no entitlements, so this normally prints nothing.
          codesign -d --entitlements :- "$app" > entitlements.plist 2>/dev/null || true
          mkdir -p altstore-info
          python3 scripts/altstore-source.py info --plist "$app/Info.plist" --ipa "dist/${{ matrix.asset }}" --entitlements entitlements.plist --out altstore-info/info.json
          cat altstore-info/info.json
      - uses: actions/upload-artifact@v4
        if: matrix.name == 'iOS'
        continue-on-error: true
        with:
          name: altstore-info
          path: altstore-info/info.json

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.inputs.tag || github.sha }}
      - name: Tag
        id: tag
        run: |
          tag="${{ github.event.inputs.tag }}"
          [ -z "$tag" ] && [ "${{ github.ref_type }}" = tag ] && tag="${{ github.ref_name }}"
          [ -z "$tag" ] && tag=$(tr -d '[:space:]' < .github/release-tag)
          case "$tag" in v*) ;; *) echo "Not a version tag: '$tag'" >&2; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: Flow-*
          path: dist
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          cat > notes.md <<'EOF'
          ### Installing

          These builds are **unsigned**.

          - **iPhone and iPad:** install `Flow-iOS.ipa` with AltStore, SideStore or Sideloadly, which sign it with your own Apple ID. In AltStore or SideStore, add the source `https://raw.githubusercontent.com/avinashgazula/Flow/altstore/source.json` once and every new release appears there as an update.
          - **Apple TV:** install `Flow-tvOS.ipa` with Sideloadly, or sign it yourself and install it with Xcode.
          - **Mac:** unzip `Flow-macOS.zip`, move Flow to Applications, then right-click it and choose Open the first time.

          No API keys are built in: Flow asks for your free TMDB key at first launch, or try it with **Explore with Sample Data**.
          EOF
          prerelease=""
          case "$tag" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            # A new tag lands on the commit that was built.
            gh release create "$tag" dist/* --target "$(git rev-parse HEAD)" --title "Flow ${tag#v}" --notes-file notes.md --generate-notes $prerelease
          fi
      # The release is already published by now, so nothing here can undo it. A failure is reported as a
      # warning, and the next release adds its own version to the source.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: altstore-info
          path: altstore-info
      - name: Update the AltStore source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          # The iOS leg's details never arrived, or the release is for something that has no iOS build.
          if [ ! -f altstore-info/info.json ]; then
            echo "::warning::AltStore source not updated: no app details from the iOS build."
            exit 0
          fi
          # Stamped the same for every try below, so a retry writes the same entry.
          date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          ok=""
          for attempt in 1 2 3; do
            rm -rf altstore-branch
            if git ls-remote --exit-code --heads "$remote" altstore >/dev/null 2>&1; then
              git clone -q --depth 1 --branch altstore "$remote" altstore-branch || continue
            else
              # The branch holds nothing but the source and its icon, so it starts from scratch.
              git init -q -b altstore altstore-branch
            fi
            cp Flow/Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png altstore-branch/icon.png
            python3 scripts/altstore-source.py update --source altstore-branch/source.json --info altstore-info/info.json --tag "$tag" --repo "${{ github.repository }}" --date "$date" || break
            cd altstore-branch
            git add -A
            if git diff --cached --quiet; then ok=1; break; fi
            git -c user.name="flow-ci" -c user.email="ci@users.noreply.github.com" commit -q -m "Add Marquee ${tag#v} to the AltStore source"
            if git push -q "$remote" HEAD:altstore; then ok=1; break; fi
            cd ..
          done
          if [ -z "$ok" ]; then
            echo "::warning::AltStore source not updated for $tag. The release itself is published; re-run this job's last steps or wait for the next release."
            exit 1
          fi
