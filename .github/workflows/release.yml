name: Release

# Builds Flow for iPhone and iPad, Apple TV and the Mac, and attaches the apps to a GitHub release.
# Runs when a version tag (v1.2.0, v1.2.0-beta.1) is pushed, or by hand: for an existing tag, or for a
# new one at the commit given, which the release then creates. Sessions that can't push tags can
# instead write the new tag into .github/release-tag on main or a claude/ branch.
#
# The apps are unsigned: there's no Apple Developer account in CI. Install the IPAs with a
# sideloading tool that signs them with your own Apple ID (AltStore, SideStore, Sideloadly), or
# sign them yourself. Built without Config/Secrets.xcconfig, so no API keys are inside: enter your
# TMDB key at first launch.
on:
  push:
    tags: ["v*"]
    branches: [main, "claude/**"]
    paths: [.github/release-tag]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release (e.g. v1.0.0-beta.1)
        required: true
      ref:
        description: Commit or branch to build when the tag doesn't exist yet
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: iOS, scheme: Flow-iOS, destination: "generic/platform=iOS", products: Release-iphoneos, asset: Flow-iOS.ipa }
          - { name: tvOS, scheme: Flow-tvOS, destination: "generic/platform=tvOS", products: Release-appletvos, asset: Flow-tvOS.ipa }
          - { name: macOS, scheme: Flow-macOS, destination: "generic/platform=macOS", products: Release, asset: Flow-macOS.zip }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.inputs.tag || github.sha }}
      - name: Tag
        id: tag
        run: |
          tag="${{ github.event.inputs.tag }}"
          [ -z "$tag" ] && [ "${{ github.ref_type }}" = tag ] && tag="${{ github.ref_name }}"
          [ -z "$tag" ] && tag=$(tr -d '[:space:]' < .github/release-tag)
          case "$tag" in v*) ;; *) echo "Not a version tag: '$tag'" >&2; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build
        run: |
          version="${{ steps.tag.outputs.tag }}"
          version="${version#v}"
          xcodebuild build \
            -project Flow.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Release \
            -derivedDataPath build/release \
            MARKETING_VERSION="${version%%-*}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -80; exit 1; }
      - name: Package
        run: |
          app="build/release/Build/Products/${{ matrix.products }}/Flow.app"
          test -d "$app"
          mkdir -p dist
          if [ "${{ matrix.name }}" = macOS ]; then
            # Ad-hoc signed so it runs on Apple silicon; still unnotarised, so open it with right-click → Open.
            codesign --force --deep --sign - "$app"
            ditto -c -k --keepParent "$app" "dist/${{ matrix.asset }}"
          else
            mkdir -p Payload
            cp -R "$app" Payload/
            zip -qry "dist/${{ matrix.asset }}" Payload
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.event.inputs.tag || github.sha }}
      - name: Tag
        id: tag
        run: |
          tag="${{ github.event.inputs.tag }}"
          [ -z "$tag" ] && [ "${{ github.ref_type }}" = tag ] && tag="${{ github.ref_name }}"
          [ -z "$tag" ] && tag=$(tr -d '[:space:]' < .github/release-tag)
          case "$tag" in v*) ;; *) echo "Not a version tag: '$tag'" >&2; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          cat > notes.md <<'EOF'
          ### Installing

          These builds are **unsigned**.

          - **iPhone and iPad:** install `Flow-iOS.ipa` with AltStore, SideStore or Sideloadly, which sign it with your own Apple ID.
          - **Apple TV:** install `Flow-tvOS.ipa` with Sideloadly, or sign it yourself and install it with Xcode.
          - **Mac:** unzip `Flow-macOS.zip`, move Flow to Applications, then right-click it and choose Open the first time.

          No API keys are built in: Flow asks for your free TMDB key at first launch, or try it with **Explore with Sample Data**.
          EOF
          prerelease=""
          case "$tag" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            # A new tag lands on the commit that was built.
            gh release create "$tag" dist/* --target "$(git rev-parse HEAD)" --title "Flow ${tag#v}" --notes-file notes.md --generate-notes $prerelease
          fi
