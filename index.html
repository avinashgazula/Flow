    <script>
      // Light or dark, before first paint: the saved choice, else the system's. The Light/Dark cell in the top bar
      // saves the same key (lib/theme.ts, keep the two in step). The faces the first paint is set in are preloaded
      // by the build (vite.config.ts), which knows their hashed names.
      try {
        var t = localStorage.getItem('flow.theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#0a0a0a' : '#ffffff')
      } catch (e) {}
    </script>
    <script>
      // Home's lead still is its largest image. Its address from the last visit is known before any
      // script loads, so the download starts now, alongside the app's code, not after it.
      // `s` is the sizes string Home rendered it with (leadSizes in features/home/Featured.tsx).
      try {
        var h = JSON.parse(localStorage.getItem('flow.lcp') || 'null')
        if (h && h.path === location.pathname && h.d && h.s) {
          var l = document.createElement('link')
          l.rel = 'preload'
          l.as = 'image'
          l.fetchPriority = 'high'
          l.imageSrcset = h.d
          l.imageSizes = h.s
          document.head.appendChild(l)
        } else h = null
      } catch (e) {
        h = null
      }
    </script>
