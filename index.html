    <script>
      // Light or dark, before first paint: the saved choice, else the system's. The Light/Dark cell in the top bar
      // saves the same key (lib/theme.ts, keep the two in step). The faces the first paint is set in are preloaded
      // by the build (vite.config.ts), which knows their hashed names.
      var t = 'light'
      try {
        t = localStorage.getItem('flow.theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
      // The colour theme, before first paint too: the saved setting (lib/palette.ts, keep the ids in step; an id this build
      // doesn't know is Admit One, the default). The address bar takes the theme's paper (testdata/contracts/themes.json).
      try {
        var q = (JSON.parse(localStorage.getItem('flow.settings.v1') || 'null') || {}).palette
        if (q !== 'index' && q !== 'openingNight') q = 'admitOne'
        document.documentElement.dataset.palette = q
        var paper = { admitOne: ['#f4f1ea', '#0d0b0a'], index: ['#ffffff', '#0a0a0a'], openingNight: ['#fbf7ee', '#0a0a0a'] }[q]
        document.querySelector('meta[name="theme-color"]').setAttribute('content', paper[t === 'dark' ? 1 : 0])
      } catch (e) {}
      // The typeface of the interface, before first paint too: the saved setting (lib/typeface.ts, keep the ids in step;
      // an older build's 'ioskeley' is Mono). System is the device's own font and needs no download.
      try {
        var f = (JSON.parse(localStorage.getItem('flow.settings.v1') || 'null') || {}).font
        if (f === 'ioskeley') f = 'mono'
        document.documentElement.dataset.font = f === 'inter' || f === 'geist' || f === 'manrope' || f === 'mono' ? f : 'system'
      } catch (e) {}
    </script>
    <script>
      // Home's lead still is its largest image. Its address from the last visit is known before any
      // script loads, so the download starts now, alongside the app's code, not after it.
      // `s` is the sizes string Home rendered it with (leadSizes in features/home/Lead.tsx).
      try {
        var h = JSON.parse(localStorage.getItem('flow.lcp') || 'null')
        if (h && h.path === location.pathname && h.d && h.s) {
          var l = document.createElement('link')
          l.rel = 'preload'
          l.as = 'image'
          l.fetchPriority = 'high'
          l.imageSrcset = h.d
          l.imageSizes = h.s
          document.head.appendChild(l)
        } else h = null
      } catch (e) {
        h = null
      }
    </script>
