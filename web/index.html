<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Flow: an Apple-quality front end for your own media servers, add-ons and IPTV." />
    <title>Flow</title>
    <link rel="icon" type="image/png" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <!-- The two hosts every first screen needs: open their connections while the script downloads. -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
    <script>
      // The hero image is the largest thing on Home. Its address from the last visit is known before
      // any script loads, so the download starts now, alongside the app's code, not after it.
      try {
        var h = JSON.parse(localStorage.getItem('flow.lcp') || 'null')
        if (h && h.path === location.pathname) {
          var l = document.createElement('link')
          l.rel = 'preload'
          l.as = 'image'
          l.fetchPriority = 'high'
          l.imageSrcset = matchMedia('(max-width: 720px)').matches ? h.m : h.d
          l.imageSizes = '100vw'
          document.head.appendChild(l)
        }
      } catch (e) {}
    </script>
    <style>
      /* Painted before any CSS file arrives, so the first frame is already Flow's black canvas. */
      html, body { background: #000; color: #fff; margin: 0; }
      #root:empty::before { content: ""; position: fixed; inset: 0; background: radial-gradient(120% 70% at 50% 0%, #15151b 0%, #000 60%); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
