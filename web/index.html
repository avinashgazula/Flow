<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Flow: an Apple-quality front end for your own media servers, add-ons and IPTV." />
    <title>Flow</title>
    <link rel="icon" type="image/png" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <!-- The two hosts every first screen needs: open their connections while the script downloads. -->
    <!-- The two weights the first screen sets most of its text in. -->
    <link rel="preload" href="%BASE_URL%fonts/ioskeley-mono-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%fonts/ioskeley-mono-semibold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
    <script>
      // The hero image is the largest thing on Home. Its address from the last visit is known before
      // any script loads, so the download starts now, alongside the app's code, not after it.
      try {
        var h = JSON.parse(localStorage.getItem('flow.lcp') || 'null')
        if (h && h.path === location.pathname) {
          var l = document.createElement('link')
          l.rel = 'preload'
          l.as = 'image'
          l.fetchPriority = 'high'
          l.imageSrcset = matchMedia('(max-width: 720px)').matches ? h.m : h.d
          l.imageSizes = '100vw'
          document.head.appendChild(l)
        }
      } catch (e) {}
    </script>
    <style>
      /* Painted before any CSS file arrives, so the first frame is already Flow's black canvas. */
      html, body { background: #000; color: #fff; margin: 0; }
      #root:empty::before { content: ""; position: fixed; inset: 0; background: radial-gradient(120% 70% at 50% 0%, #15151b 0%, #000 60%); }
      /* A still of Home's hero, drawn from the HTML alone on a repeat visit. Same box and crop as the
         real hero (Hero.module.css), which replaces it without a visible change. */
      .shell-hero { position: relative; height: min(86vh, calc(56.25vw + 120px)); min-height: 480px; overflow: hidden; }
      .shell-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
      .shell-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgb(0 0 0 / 0.78) 0%, rgb(0 0 0 / 0.35) 38%, transparent 62%), linear-gradient(0deg, #000 0%, rgb(0 0 0 / 0.55) 18%, transparent 46%), linear-gradient(180deg, rgb(0 0 0 / 0.5) 0%, transparent 18%); }
      @media (max-width: 720px) {
        .shell-hero { height: auto; min-height: 0; aspect-ratio: 3 / 4.3; margin: calc(56px + env(safe-area-inset-top) + 12px) clamp(16px, 4vw, 56px) 0; border-radius: 22px; }
        .shell-hero img { object-position: center top; }
        .shell-hero::after { background: linear-gradient(0deg, rgb(0 0 0 / 0.92) 0%, rgb(0 0 0 / 0.5) 30%, transparent 55%); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.h && h.path === location.pathname && h.d) {
        document.getElementById('root').innerHTML =
          '<div class="shell-hero" aria-hidden="true"><picture><source media="(max-width: 720px)" sizes="100vw" srcset="' + h.m + '"><img alt="" sizes="100vw" fetchpriority="high" srcset="' + h.d + '"></picture></div>'
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
